name: Answer quality

# Asks the deployed app the 30 questions in data/eval/answer_quality.jsonl and grades the replies.
# Run it by hand after a prompt or model change; it uses that server's Gemini key, not one stored here.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Server to test
        default: https://fixsaathi-vu9s.onrender.com

permissions:
  contents: write

jobs:
  answers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx
      - name: Wake the server
        run: curl -fsS --retry 6 --retry-delay 10 --retry-all-errors "${{ inputs.base_url }}/health"
      - run: python backend/scripts/eval_answers.py --base-url "${{ inputs.base_url }}" --out answer-eval.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: answer-eval
          path: answer-eval.json
      - name: Keep the result on the answer-eval-results branch
        if: always()
        run: |
          f="answer-eval-$(date -u +%Y-%m-%dT%H%M).json"
          cp answer-eval.json "/tmp/$f" 2>/dev/null || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin answer-eval-results && git checkout answer-eval-results || git checkout --orphan answer-eval-results
          git rm -rfq . 2>/dev/null || true
          mkdir -p runs && cp "/tmp/$f" runs/ && git add runs && git commit -qm "Answer quality: $f" && git push -q origin answer-eval-results
