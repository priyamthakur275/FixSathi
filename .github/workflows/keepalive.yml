name: keepalive

# Render's free plan puts the service to sleep after 15 minutes without traffic, and waking it takes 30-50 seconds.
# GitHub starts scheduled workflows late or skips them, so a 5-minute schedule alone ran only a few times a day.
# Instead each run stays up for about 5 hours and pings every 4 minutes; runs start every 5 hours and overlap a little.
on:
  schedule:
    - cron: '7 */5 * * *'
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Ping every 4 minutes for 5.5 hours
        run: |
          end=$(( $(date +%s) + 330*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            curl -fsS --max-time 90 -o /dev/null -w "%{http_code} %{time_total}s\n" https://fixsaathi-vu9s.onrender.com/health || echo "ping failed"
            sleep 240
          done
