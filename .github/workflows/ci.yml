name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fixsaathi_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/fixsaathi_test
      SECRET_KEY: ci-test-secret-key-0123456789-abcdefghijk
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest
      - name: Tests (real migrations on PostgreSQL, Gemini replaced by a fake)
        run: pytest -q
      - name: Offline evaluation (retrieval and safety filter)
        run: |
          createdb -h localhost -U postgres fixsaathi_eval
          DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/fixsaathi_eval alembic upgrade head
          DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/fixsaathi_eval python scripts/ingest_knowledge.py
          DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/fixsaathi_eval python scripts/evaluate.py --no-write
        env:
          PGPASSWORD: postgres
          GEMINI_API_KEY: ''

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
