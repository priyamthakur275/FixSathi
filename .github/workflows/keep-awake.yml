# Wakes the API on demand (Actions tab > keep-awake > Run workflow), e.g. a few minutes before a demo.
# Not scheduled: Render's free plan gives a workspace 750 instance-hours a month in total, and pinging every
# 10 minutes keeps a service awake ~720 hours, which would leave nothing for the other free services.
# To run it on a schedule during an evaluation window, add:   schedule: [{cron: '*/10 * * * *'}]
name: keep-awake
on:
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 90 --retry 2 https://fixsaathi-copilot-api-v9cb.onrender.com/ready
