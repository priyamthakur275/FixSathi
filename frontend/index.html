<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preload" href="/assets/emblem.webp" as="image" type="image/webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f17" />
    <meta name="description" content="FixSaathi: AI Repair Copilot for field technicians" />
    <title>FixSaathi | AI Repair Copilot</title>
    <script>
      // Apply the saved theme before the first paint, so light/sunlight mode never flashes dark.
      try {
        var t = localStorage.getItem('fixsaathi.theme') || 'system'
        if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        if (!['dark', 'light', 'sunlight'].includes(t)) t = 'dark'
        document.documentElement.dataset.theme = t
      } catch (e) { document.documentElement.dataset.theme = 'dark' }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
