<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FixSaathi · Manager dashboard</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    header { display: flex; align-items: center; gap: 14px; padding: 14px 24px; background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 3; }
    .wrap { max-width: 1240px; margin: 0 auto; padding: 18px 24px 40px; display: grid; gap: 16px; }
    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .kpi .v { font-size: 30px; font-weight: 700; margin-top: 2px; }
    .kpi .l { font-size: 13px; color: var(--ink-2); font-weight: 600; }
    .grid { display: grid; grid-template-columns: 1.15fr 1fr; gap: 16px; align-items: start; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { text-align: left; font-size: 12px; color: var(--ink-2); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); }
    td { padding: 10px; border-bottom: 1px solid #f1f3f4; vertical-align: top; }
    tr.job { cursor: pointer; }
    tr.job:hover, tr.job.sel { background: var(--blue-50); }
    tr.flash { animation: flash 1.2s; }
    @keyframes flash { from { background: #fef7e0; } }
    .detail { position: sticky; top: 76px; display: grid; gap: 12px; }
    .kv { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; font-size: 14px; }
    .kv b { color: var(--ink-2); font-weight: 600; }
    .photos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .photos figure { margin: 0; }
    .photos img { width: 100%; border-radius: 10px; display: block; background: #eee; aspect-ratio: 4/3; object-fit: cover; }
    .photos figcaption { font-size: 12px; color: var(--ink-2); margin-top: 4px; }
    ul.clean { margin: 0; padding-left: 18px; }
    .tx { max-height: 220px; overflow: auto; font-size: 13px; display: grid; gap: 4px; }
    .live-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); display: inline-block; animation: pulse 1.4s infinite; }
    @keyframes pulse { 50% { opacity: .3; } }
    .empty { padding: 30px; text-align: center; color: var(--ink-2); }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } .kpis { grid-template-columns: repeat(2, 1fr); } .detail { position: static; } }
  </style>
</head>
<body>
  <header>
    <div class="brand"><div class="logo">F</div>FixSaathi</div>
    <span class="muted">Service manager dashboard</span>
    <span class="grow"></span>
    <span id="feed" class="chip grey small">Connecting…</span>
    <a class="btn ghost" href="/" target="_blank">Technician app ↗</a>
  </header>

  <div class="wrap">
    <div class="kpis">
      <div class="card kpi"><div class="l">Jobs today</div><div class="v" id="kJobs">0</div></div>
      <div class="card kpi"><div class="l">First-time-fix rate</div><div class="v" id="kFtf">–</div></div>
      <div class="card kpi"><div class="l">Safety checks confirmed</div><div class="v" id="kSafe">–</div></div>
      <div class="card kpi"><div class="l">Live now / escalated</div><div class="v"><span id="kLive">0</span> <span class="muted" style="font-size:20px">/</span> <span id="kEsc">0</span></div></div>
    </div>

    <div class="grid">
      <div class="card" style="padding:6px 6px 2px">
        <table>
          <thead><tr><th>Job</th><th>Technician</th><th>Appliance / fault</th><th>Safety</th><th>Status</th></tr></thead>
          <tbody id="rows"><tr><td colspan="5" class="empty">No jobs yet. Start a repair in the technician app.</td></tr></tbody>
        </table>
      </div>
      <div id="detail" class="detail"><div class="card empty">Select a job to see the full service report.</div></div>
    </div>
  </div>

  <script type="module">
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
    const code = new URLSearchParams(location.search).get('code') || localStorage.getItem('fs_code') || '';
    const q = code ? `?code=${encodeURIComponent(code)}` : '';
    const jobs = new Map();
    let selected = null;

    const STATUS = {
      in_progress: ['blue', '● Live'], completed: ['green', 'Fixed'], partially_fixed: ['amber', 'Partly fixed'],
      not_fixed: ['red', 'Not fixed'], escalated: ['red', 'Escalated'], interrupted: ['grey', 'Interrupted'],
    };
    const time = (iso) => iso ? new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';

    function render(flashId) {
      const list = [...jobs.values()].sort((a, b) => b.updatedAt.localeCompare(a.updatedAt));
      $('rows').innerHTML = list.length ? list.map((j) => {
        const [c, t] = STATUS[j.status] || ['grey', j.status];
        const appl = j.report?.appliance || j.diagnosis?.appliance || '–';
        const fault = j.report?.fault_found || j.diagnosis?.causes?.[0]?.cause || j.complaint || '';
        return `<tr class="job ${j.id === selected ? 'sel' : ''} ${j.id === flashId ? 'flash' : ''}" data-id="${esc(j.id)}">
          <td><b>${esc(j.id)}</b><div class="small muted">${time(j.createdAt)}</div></td>
          <td>${esc(j.technician)}<div class="small muted">${esc(j.customer)}</div></td>
          <td>${esc(appl)}<div class="small muted">${esc(fault).slice(0, 70)}</div></td>
          <td>${j.safety?.confirmed ? '<span class="chip green small">✓ Confirmed</span>' : '<span class="chip grey small">Pending</span>'}${j.safety?.blockedAttempts ? `<div class="small muted">${j.safety.blockedAttempts} unsafe step(s) blocked</div>` : ''}</td>
          <td><span class="chip ${c} small">${j.status === 'in_progress' ? '<span class="live-dot"></span> Live' : t}</span><div class="small muted">${j.steps?.length || 0} steps</div></td></tr>`;
      }).join('') : '<tr><td colspan="5" class="empty">No jobs yet. Start a repair in the technician app.</td></tr>';
      for (const tr of document.querySelectorAll('tr.job')) tr.onclick = () => openJob(tr.dataset.id);

      const today = new Date().toDateString();
      const todays = list.filter((j) => new Date(j.createdAt).toDateString() === today);
      const done = list.filter((j) => j.report);
      $('kJobs').textContent = todays.length;
      $('kFtf').textContent = done.length ? Math.round((100 * done.filter((j) => j.report.first_time_fix).length) / done.length) + '%' : '–';
      const started = list.filter((j) => j.status !== 'interrupted' || j.steps?.length);
      $('kSafe').textContent = started.length ? Math.round((100 * started.filter((j) => j.safety?.confirmed).length) / started.length) + '%' : '–';
      $('kLive').textContent = list.filter((j) => j.status === 'in_progress').length;
      $('kEsc').textContent = list.filter((j) => j.status === 'escalated').length;
    }

    async function openJob(id) {
      selected = id;
      render();
      const j = await (await fetch(`/api/jobs/${encodeURIComponent(id)}${q}`)).json();
      const r = j.report || {};
      const list = (a) => (a && a.length ? `<ul class="clean">${a.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : '–');
      const [c, t] = STATUS[j.status] || ['grey', j.status];
      $('detail').innerHTML = `
        <div class="card">
          <div class="row" style="margin-bottom:10px"><h3 class="grow">${esc(j.id)}</h3><span class="chip ${c}">${esc(t)}</span></div>
          <div class="kv">
            <b>Technician</b><span>${esc(j.technician)}</span>
            <b>Customer / site</b><span>${esc(j.customer || '–')}</span>
            <b>Appliance</b><span>${esc([r.appliance || j.diagnosis?.appliance, r.brand_model || j.diagnosis?.brand_model].filter((x) => x && x !== 'Not recorded' && x !== 'unknown').join(' · ') || '–')}</span>
            <b>Complaint</b><span>${esc(r.complaint || j.complaint || '–')}</span>
            <b>Fault found</b><span>${esc(r.fault_found || '–')}</span>
            <b>Root cause</b><span>${esc(r.root_cause || '–')}</span>
            <b>Work done</b><span>${list(r.work_done || j.steps?.map((s) => s.instruction))}</span>
            <b>Parts used</b><span>${esc((r.parts_used || []).join(', ') || '–')}</span>
            <b>Safety</b><span>${j.safety?.confirmed ? '✓ ' + esc((j.safety.checks || []).join('; ')) : 'Not confirmed'}${j.safety?.blockedAttempts ? `<div class="small muted">${j.safety.blockedAttempts} unsafe step(s) blocked by safety agent</div>` : ''}</span>
            <b>First-time fix</b><span>${r.first_time_fix === undefined ? '–' : r.first_time_fix ? 'Yes' : 'No'}</span>
            <b>Escalations</b><span>${list((j.escalations || []).map((e) => e.reason))}</span>
            <b>Follow-up</b><span>${esc(r.follow_up || '–')}</span>
            <b>For customer</b><span>${esc(r.customer_summary || '–')}</span>
          </div>
        </div>
        <div class="card"><b>Photos</b><div class="photos" style="margin-top:8px">
          <figure><img alt="Before" ${j.photos?.before ? `src="data:image/jpeg;base64,${j.photos.before}"` : ''}/><figcaption>Before</figcaption></figure>
          <figure><img alt="After" ${j.photos?.after ? `src="data:image/jpeg;base64,${j.photos.after}"` : ''}/><figcaption>After</figcaption></figure>
        </div></div>
        <div class="card"><b>Diagnosis</b><div class="small" style="margin-top:6px">${(j.diagnosis?.causes || []).map((x, i) => `${i + 1}. <b>${esc(x.cause)}</b> <span class="muted">(${esc(x.likelihood)})</span>`).join('<br>') || '–'}</div></div>
        <div class="card"><b>Transcript</b><div class="tx" style="margin-top:6px">${(j.transcript || []).map((t) => `<div><b>${t.role === 'technician' ? '👷' : '🤖'}</b> ${esc(t.text)}</div>`).join('') || '–'}</div></div>`;
    }

    async function load() {
      const res = await fetch('/api/jobs' + q);
      if (!res.ok) { $('feed').textContent = 'Access code needed (?code=…)'; return; }
      for (const j of await res.json()) jobs.set(j.id, j);
      render();
    }

    function live() {
      const es = new EventSource('/api/events' + q);
      es.onopen = () => { $('feed').className = 'chip green small'; $('feed').innerHTML = '<span class="live-dot"></span> Live feed'; };
      es.onerror = () => { $('feed').className = 'chip red small'; $('feed').textContent = 'Reconnecting…'; };
      es.onmessage = (e) => {
        const j = JSON.parse(e.data);
        jobs.set(j.id, j);
        render(j.id);
        if (j.id === selected) openJob(j.id);
      };
    }

    load().then(live);
  </script>
</body>
</html>
