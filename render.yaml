# Render Blueprint: one Docker web service (the website and the API on the same address) using external permanent Neon
# PostgreSQL (DATABASE_URL with ?sslmode=require) and a personal GEMINI_API_KEY (sync: false, never committed), deploying
# branch antigravity-v2.
# Deploy to any Render account: https://render.com/deploy?repo=https://github.com/priyamthakur275/FixSathi/tree/antigravity-v2
# Nothing here names a URL, so the same file works in every account: the site calls the API on its own origin, so no CORS
# setting and no API address are needed.
# Secrets are never stored here: SECRET_KEY is generated by Render, and DATABASE_URL + GEMINI_API_KEY are asked for when
# the Blueprint is applied (sync: false). Without a key the app runs, says AI is not configured, and the labelled demo
# scenarios still work.

services:
  - type: web
    name: fixsaathi
    runtime: docker
    branch: antigravity-v2
    plan: free
    region: singapore          # match region to your Neon project region (e.g. singapore or ohio)
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /ready  # 200 only when the database answers
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false          # Neon direct connection URL ending with ?sslmode=require; postgresql:// is normalised by app/config.py
      - key: SECRET_KEY
        generateValue: true  # random, generated by Render; signs login tokens
      - key: GEMINI_API_KEY
        sync: false          # personal Gemini API key asked for when the Blueprint is applied; never committed
      - key: APP_ENV
        value: production
      - key: STORAGE_PROVIDER
        value: database      # photos survive restarts (no persistent disk on the free plan)
      - key: VECTOR_SEARCH_MODE
        value: auto
      - key: GEMINI_AGENT_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_FAST_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_THINKING_LEVEL
        value: low
      - key: GEMINI_EMBED_MODEL
        value: gemini-embedding-2
      - key: GEMINI_LIVE_MODEL
        value: gemini-3.8-live
      - key: GEMINI_TTS_MODEL
        value: gemini-3.8-flash-tts
      - key: NANO_BANANA_MODEL
        value: gemini-3.1-flash-image
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "14"
      - key: AUTH_RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: AI_REQUESTS_PER_MINUTE
        value: "20"
      - key: AI_REQUESTS_PER_DAY
        value: "400"
