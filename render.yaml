# Render Blueprint: static website + FastAPI API + PostgreSQL, all on the free plan, in Singapore.
# Secrets are never stored here: SECRET_KEY is generated by Render, DATABASE_URL comes from the database,
# and GEMINI_API_KEY is entered in the Render Dashboard (sync: false).

databases:
  - name: fixsaathi-copilot-db
    plan: free
    region: singapore
    databaseName: fixsaathi
    user: fixsaathi
    postgresMajorVersion: "16"
    ipAllowList: []          # no public access: only Render services in this workspace can connect

services:
  - type: web
    name: fixsaathi-copilot-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && sh scripts/render_start.sh
    healthCheckPath: /ready  # 200 only when the database answers
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.11"
      - key: DATABASE_URL
        fromDatabase:
          name: fixsaathi-copilot-db
          property: connectionString   # internal URL; postgres:// is normalised by app/config.py
      - key: SECRET_KEY
        generateValue: true            # random, generated by Render; signs login tokens
      - key: GEMINI_API_KEY
        sync: false                    # enter in the Render Dashboard; never committed
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://fixsaathi-copilot-v9cb.onrender.com
      - key: STORAGE_PROVIDER
        value: database                # photos survive restarts (no persistent disk on the free plan)
      - key: VECTOR_SEARCH_MODE
        value: auto
      - key: GEMINI_AGENT_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_AGENT_FALLBACK_MODELS
        value: gemini-3.5-flash,gemini-3.1-flash-lite
      - key: GEMINI_THINKING_LEVEL
        value: low
      - key: GEMINI_EMBED_MODEL
        value: gemini-embedding-001
      - key: NANO_BANANA_MODEL
        value: gemini-3.1-flash-image
      # GEMINI_LIVE_MODEL is left unset: the current key has no Live access, so voice uses browser speech + chat.
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "14"
      - key: AUTH_RATE_LIMIT_PER_MINUTE
        value: "10"

  - type: web
    name: fixsaathi-copilot
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22.19.0"
      - key: VITE_API_BASE_URL
        value: https://fixsaathi-copilot-api-v9cb.onrender.com
    routes:
      - type: rewrite                  # client-side routing: /session/123, /reports ... serve the app
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
