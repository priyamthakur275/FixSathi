# Render Blueprint: one Docker web service (the website and the API on the same address) plus PostgreSQL, free plan, Singapore.
# Deploy to any Render account: https://render.com/deploy?repo=https://github.com/priyamthakur275/FixSathi
# Nothing here names a URL, so the same file works in every account: the site calls the API on its own origin, so no CORS
# setting and no API address are needed.
# Secrets are never stored here: SECRET_KEY is generated by Render, DATABASE_URL comes from the database, and GEMINI_API_KEY
# is asked for when the Blueprint is applied (sync: false). Without a key the app runs, says AI is not configured, and the
# labelled demo scenarios still work.

databases:
  - name: fixsaathi-db
    plan: free
    region: singapore
    databaseName: fixsaathi
    user: fixsaathi
    postgresMajorVersion: "16"
    ipAllowList: []          # no public access: only services in this workspace can connect

services:
  - type: web
    name: fixsaathi
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /ready  # 200 only when the database answers
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fixsaathi-db
          property: connectionString   # internal URL; postgres:// is normalised by app/config.py
      - key: SECRET_KEY
        generateValue: true            # random, generated by Render; signs login tokens
      - key: GEMINI_API_KEY
        sync: false                    # asked for when the Blueprint is applied; never committed
      - key: APP_ENV
        value: production
      - key: STORAGE_PROVIDER
        value: database                # photos survive restarts (no persistent disk on the free plan)
      - key: VECTOR_SEARCH_MODE
        value: auto
      - key: GEMINI_AGENT_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_AGENT_FALLBACK_MODELS
        value: gemini-3.5-flash,gemini-3.1-flash-lite
      - key: GEMINI_THINKING_LEVEL
        value: low
      - key: GEMINI_EMBED_MODEL
        value: gemini-embedding-001
      - key: NANO_BANANA_MODEL
        value: gemini-3.1-flash-image
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "14"
      - key: AUTH_RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: AI_REQUESTS_PER_MINUTE
        value: "20"
      - key: AI_REQUESTS_PER_DAY
        value: "400"
